<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuga Pulmith Galbadage | Portfolio</title>
    <meta name="description" content="Portfolio of Manuga Pulmith Galbadage - Aspiring Frontend Developer & Data Analytics Learner">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0a0a',
                        card: '#121212',
                        primary: '#6366f1', // Indigo
                        secondary: '#a855f7', // Purple
                        accent: '#06b6d4', // Cyan
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-high {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .text-gradient {
            background: linear-gradient(to right, #818cf8, #c084fc, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bg-gradient-glow {
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15), transparent 70%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, useScroll, useTransform, AnimatePresence } = window.Motion;

        // --- Icons Component (SVG paths for reliability in single file) ---
        const Icons = {
            Code: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>,
            Globe: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>,
            Mail: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>,
            Github: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>,
            Download: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Send: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>,
            MessageCircle: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>,
            Terminal: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>,
            Zap: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
            Award: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>,
            ExternalLink: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        };

        // --- Components ---

        const Navbar = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'About', href: '#about' },
                { name: 'Skills', href: '#skills' },
                { name: 'Certifications', href: '#certifications' },
                { name: 'Projects', href: '#projects' },
                { name: 'Design', href: '#design' },
                { name: 'Journey', href: '#journey' },
                { name: 'Contact', href: '#contact' },
            ];

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'glass py-4' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <motion.a 
                            href="#"
                            initial={{ opacity: 0, x: -20 }}
                            animate={{ opacity: 1, x: 0 }}
                            className="text-xl font-bold tracking-tight"
                        >
                            <span className="text-gradient">Manuga Pulmith</span>
                        </motion.a>

                        {/* Desktop Menu */}
                        <div className="hidden md:flex space-x-8">
                            {navLinks.map((link, index) => (
                                <motion.a
                                    key={link.name}
                                    href={link.href}
                                    initial={{ opacity: 0, y: -20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    transition={{ delay: index * 0.1 }}
                                    className="text-sm font-medium text-gray-300 hover:text-white transition-colors"
                                >
                                    {link.name}
                                </motion.a>
                            ))}
                        </div>

                        {/* Mobile Toggle */}
                        <div className="md:hidden">
                            <button onClick={() => setIsOpen(!isOpen)} className="text-white">
                                {isOpen ? '✕' : '☰'}
                            </button>
                        </div>
                    </div>

                    {/* Mobile Menu */}
                    <AnimatePresence>
                        {isOpen && (
                            <motion.div
                                initial={{ opacity: 0, height: 0 }}
                                animate={{ opacity: 1, height: 'auto' }}
                                exit={{ opacity: 0, height: 0 }}
                                className="md:hidden glass-high border-t border-gray-800"
                            >
                                <div className="flex flex-col p-6 space-y-4">
                                    {navLinks.map((link) => (
                                        <a key={link.name} href={link.href} onClick={() => setIsOpen(false)} className="text-gray-300 hover:text-white">
                                            {link.name}
                                        </a>
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section className="relative min-h-screen flex items-center justify-center pt-20 overflow-hidden">
                    {/* Background Blobs */}
                    <div className="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
                        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob"></div>
                        <div className="absolute top-1/3 right-1/4 w-96 h-96 bg-blue-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-2000"></div>
                        <div className="absolute -bottom-32 left-1/3 w-96 h-96 bg-cyan-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-4000"></div>
                    </div>

                    <div className="container mx-auto px-6 text-center z-10">
                        <motion.div
                            initial={{ opacity: 0, y: 30 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 0.8 }}
                        >
                            <span className="inline-block py-1 px-3 rounded-full bg-white/5 border border-white/10 text-sm text-cyan-400 mb-6 font-medium">
                                Available for Internships & Freelance
                            </span>
                            <h1 className="text-5xl md:text-7xl font-bold mb-6 tracking-tight leading-tight">
                                Manuga Pulmith <br />
                                <span className="text-gradient">Galbadage</span>
                            </h1>
                            <h2 className="text-xl md:text-2xl text-gray-400 mb-8 font-light max-w-2xl mx-auto">
                                Aspiring Frontend Developer, Data Analytics Learner & Digital Creator
                            </h2>
                            <p className="text-gray-400 mb-10 max-w-2xl mx-auto leading-relaxed">
                                I am passionate about technology, modern web development, digital experiences, and continuous learning. I enjoy building responsive websites, learning Python and data analytics, and improving my skills through real-world projects and certifications.
                            </p>

                            <div className="flex flex-col md:flex-row gap-4 justify-center items-center">
                                <motion.a
                                    href="#projects"
                                    whileHover={{ scale: 1.05 }}
                                    whileTap={{ scale: 0.95 }}
                                    className="px-8 py-4 bg-white text-black rounded-full font-semibold hover:bg-gray-200 transition-colors flex items-center gap-2"
                                >
                                    View Projects <Icons.Globe size={18} />
                                </motion.a>
                                <motion.a
                                    href="#" 
                                    // Add actual CV file link here
                                    whileHover={{ scale: 1.05 }}
                                    whileTap={{ scale: 0.95 }}
                                    className="px-8 py-4 glass rounded-full font-semibold hover:bg-white/10 transition-colors flex items-center gap-2 text-white border border-white/20"
                                >
                                    Download CV <Icons.Download size={18} />
                                </motion.a>
                                <motion.a
                                    href="#contact"
                                    whileHover={{ scale: 1.05 }}
                                    whileTap={{ scale: 0.95 }}
                                    className="px-8 py-4 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-full font-semibold shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 transition-all flex items-center gap-2"
                                >
                                    Contact Me <Icons.Send size={18} />
                                </motion.a>
                            </div>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const SectionTitle = ({ children, subtitle }) => (
            <div className="mb-16 text-center">
                <motion.h2 
                    initial={{ opacity: 0, y: 20 }}
                    whileInView={{ opacity: 1, y: 0 }}
                    viewport={{ once: true }}
                    className="text-3xl md:text-4xl font-bold mb-4"
                >
                    {children}
                </motion.h2>
                {subtitle && <p className="text-gray-400 max-w-xl mx-auto">{subtitle}</p>}
                <div className="w-20 h-1 bg-gradient-to-r from-purple-500 to-blue-500 mx-auto mt-6 rounded-full"></div>
            </div>
        );

        const About = () => {
            const cards = [
                { icon: Icons.Code, title: "Tech Enthusiast", desc: "Deep passion for exploring new technologies and understanding how digital tools shape the world." },
                { icon: Icons.Zap, title: "Self-Learner", desc: "Driven by curiosity. Constantly taking courses and building projects to expand my knowledge base." },
                { icon: Icons.Globe, title: "Digital Creator", desc: "Focused on building professional digital experiences that are not only functional but also visually appealing." },
            ];

            return (
                <section id="about" className="py-24 relative">
                    <div className="container mx-auto px-6">
                        <SectionTitle>About Me</SectionTitle>
                        
                        <div className="grid md:grid-cols-3 gap-8">
                            {cards.map((card, i) => (
                                <motion.div
                                    key={i}
                                    initial={{ opacity: 0, y: 30 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: i * 0.1 }}
                                    whileHover={{ y: -5 }}
                                    className="glass p-8 rounded-2xl hover:bg-white/5 transition-all duration-300 group"
                                >
                                    <div className="w-12 h-12 bg-gradient-to-br from-purple-500/20 to-blue-500/20 rounded-lg flex items-center justify-center mb-6 text-cyan-400 group-hover:scale-110 transition-transform">
                                        <card.icon size={24} />
                                    </div>
                                    <h3 className="text-xl font-bold mb-3">{card.title}</h3>
                                    <p className="text-gray-400 leading-relaxed">{card.desc}</p>
                                </motion.div>
                            ))}
                        </div>

                        <motion.div 
                            initial={{ opacity: 0 }}
                            whileInView={{ opacity: 1 }}
                            viewport={{ once: true }}
                            className="mt-16 glass-high p-8 rounded-2xl border border-white/10 max-w-4xl mx-auto text-center"
                        >
                            <h3 className="text-2xl font-bold mb-4">My Goal</h3>
                            <p className="text-lg text-gray-300">
                                To secure a challenging role in the tech industry where I can utilize my skills in Frontend Development and Data Analytics. I am eager to contribute to meaningful projects, learn from experienced professionals, and grow into a key asset for a forward-thinking company.
                            </p>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Skills = () => {
            const skills = [
                { name: "HTML",              level: "Proficient",    pct: 85, icon: "html5"           },
                { name: "CSS",               level: "Proficient",    pct: 80, icon: "css3"            },
                { name: "JavaScript",        level: "Intermediate",  pct: 65, icon: "javascript"      },
                { name: "Python",            level: "Beginner",      pct: 45, icon: "python"          },
                { name: "React",             level: "Learning",      pct: 35, icon: "react"           },
                { name: "Git",               level: "Intermediate",  pct: 60, icon: "git"             },
                { name: "GitHub",            level: "Intermediate",  pct: 60, icon: "github"          },
                { name: "Data Analytics",    level: "Learning",      pct: 40, icon: "googleanalytics" },
                { name: "Digital Marketing", level: "Certified",     pct: 70, icon: "hubspot"         },
                { name: "UI/UX Basics",      level: "Basic",         pct: 30, icon: "figma"           },
            ];

            return (
                <section id="skills" className="py-24 bg-black/30">
                    <div className="container mx-auto px-6">
                        <SectionTitle>Technical Skills</SectionTitle>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 max-w-5xl mx-auto">
                            {skills.map((skill, i) => (
                                <motion.div
                                    key={i}
                                    initial={{ opacity: 0, y: 20 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: i * 0.07 }}
                                    whileHover={{ y: -4 }}
                                    className="glass p-5 rounded-xl border border-white/5 hover:border-purple-500/40 transition-all duration-300 flex flex-col gap-3"
                                >
                                    {/* Logo */}
                                    <div className="w-10 h-10 rounded-lg bg-white/5 flex items-center justify-center">
                                        <img
                                            src={`https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/${skill.icon}.svg`}
                                            alt={skill.name}
                                            width="22"
                                            height="22"
                                            style={{ filter: 'invert(1) brightness(0.75)' }}
                                            onError={(e) => { e.target.style.display = 'none'; }}
                                        />
                                    </div>
                                    {/* Name & Level */}
                                    <div>
                                        <p className="text-sm font-semibold text-white leading-tight">{skill.name}</p>
                                        <p className="text-xs text-gray-500 mt-0.5">{skill.level}</p>
                                    </div>
                                    {/* Progress Bar */}
                                    <div className="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                                        <motion.div
                                            className="h-full bg-gradient-to-r from-purple-500 to-blue-500 rounded-full"
                                            initial={{ width: 0 }}
                                            whileInView={{ width: `${skill.pct}%` }}
                                            viewport={{ once: true }}
                                            transition={{ duration: 0.8, delay: i * 0.07, ease: "easeOut" }}
                                        />
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Certifications = () => {
            const completed = [
                { title: "Google Data Analytics Professional Certificate", issuer: "Google", detail: "Course 1 Completed" },
                { title: "Python Beginner Course", issuer: "Open University of Moratuwa", detail: "Completed" },
                { title: "HubSpot Digital Marketing Certificate", issuer: "HubSpot", detail: "Certified" },
                { title: "Certificate in Computer Applications Level 1", issuer: "SUIT METRO COLLEGE", detail: "First Class Distinction" },
                { title: "Certificate in Computer Applications Level 2", issuer: "SUIT METRO COLLEGE", detail: "First Class Distinction" },
            ];

            const learning = [
                { title: "Google Data Analytics Professional Certificate", issuer: "Google", detail: "Course 2 In Progress" },
                { title: "Intermediate Python Course", issuer: "Online Platform", detail: "Ongoing" },
                { title: "Frontend Web Development Course", issuer: "Online Platform", detail: "Ongoing" },
            ];

            return (
                <section id="certifications" className="py-24">
                    <div className="container mx-auto px-6">
                        <SectionTitle>Certifications & Learning</SectionTitle>
                        
                        <div className="grid md:grid-cols-2 gap-12">
                            {/* Completed */}
                            <div>
                                <h3 className="text-xl font-semibold mb-6 flex items-center gap-2">
                                    <Icons.Award className="text-yellow-400" /> Completed
                                </h3>
                                <div className="space-y-4">
                                    {completed.map((cert, i) => (
                                        <motion.div
                                            key={i}
                                            initial={{ opacity: 0, x: -20 }}
                                            whileInView={{ opacity: 1, x: 0 }}
                                            viewport={{ once: true }}
                                            transition={{ delay: i * 0.1 }}
                                            className="glass p-5 rounded-xl border-l-4 border-green-500 hover:bg-white/5 transition-colors"
                                        >
                                            <h4 className="font-bold text-lg">{cert.title}</h4>
                                            <p className="text-sm text-gray-400">{cert.issuer}</p>
                                            <span className="inline-block mt-2 text-xs font-mono bg-green-500/10 text-green-400 px-2 py-1 rounded">{cert.detail}</span>
                                        </motion.div>
                                    ))}
                                </div>
                            </div>

                            {/* Currently Learning */}
                            <div>
                                <h3 className="text-xl font-semibold mb-6 flex items-center gap-2">
                                    <Icons.Terminal className="text-blue-400" /> Currently Learning
                                </h3>
                                <div className="space-y-4">
                                    {learning.map((cert, i) => (
                                        <motion.div
                                            key={i}
                                            initial={{ opacity: 0, x: 20 }}
                                            whileInView={{ opacity: 1, x: 0 }}
                                            viewport={{ once: true }}
                                            transition={{ delay: i * 0.1 }}
                                            className="glass p-5 rounded-xl border-l-4 border-blue-500 hover:bg-white/5 transition-colors"
                                        >
                                            <h4 className="font-bold text-lg">{cert.title}</h4>
                                            <p className="text-sm text-gray-400">{cert.issuer}</p>
                                            <span className="inline-block mt-2 text-xs font-mono bg-blue-500/10 text-blue-400 px-2 py-1 rounded">{cert.detail}</span>
                                        </motion.div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Projects = () => {
            return (
                <section id="projects" className="py-24 bg-black/30">
                    <div className="container mx-auto px-6">
                        <SectionTitle>Featured Projects</SectionTitle>
                        
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
                            {/* Main Project */}
                            <motion.div 
                                className="group glass-high rounded-2xl overflow-hidden hover:shadow-2xl hover:shadow-purple-500/10 transition-all duration-500 border border-white/10"
                                initial={{ opacity: 0, y: 30 }}
                                whileInView={{ opacity: 1, y: 0 }}
                                viewport={{ once: true }}
                            >
                                <div className="h-48 bg-gradient-to-br from-indigo-900 to-slate-900 relative overflow-hidden">
                                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&q=80&w=1000')] bg-cover bg-center opacity-40 group-hover:scale-105 transition-transform duration-700"></div>
                                    <div className="absolute inset-0 bg-gradient-to-t from-card to-transparent"></div>
                                </div>

                            <div className="glass-high p-5 sm:p-8 rounded-2xl space-y-5 sm:space-y-6 border border-white/10">
                                <div>
                                    <label className="block text-sm font-medium text-gray-400 mb-2">Your Name</label>
                                    <input
                                        type="text"
                                        id="wa-name"
                                        className="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500 text-white transition-colors"
                                        placeholder="Your Name"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-400 mb-2">Message</label>
                                    <textarea
                                        id="wa-message"
                                        rows="4"
                                        className="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500 text-white transition-colors"
                                        placeholder="How can I help you?"
                                    ></textarea>
                                </div>
                                <button
                                    onClick={() => {
                                        const name = document.getElementById('wa-name').value.trim();
                                        const message = document.getElementById('wa-message').value.trim();
                                        if (!name || !message) {
                                            alert('Please fill in both fields.');
                                            return;
                                        }
                                        const text = `Hi Manuga, I'm ${name}.\n\n${message}`;
                                        window.open(`https://wa.me/94776237532?text=${encodeURIComponent(text)}`, '_blank');
                                    }}
                                    className="w-full py-4 bg-gradient-to-r from-green-600 to-emerald-500 rounded-lg font-bold text-white shadow-lg shadow-green-500/25 hover:shadow-green-500/40 transition-all hover:scale-[1.02] flex items-center justify-center gap-2"
                                >
                                    <Icons.MessageCircle size={20} /> Send via WhatsApp
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-8 border-t border-white/10 bg-black text-center">
                <p className="text-gray-500 text-sm">
                    &copy; {new Date().getFullYear()} Manuga Pulmith Galbadage. All rights reserved.
                </p>
                <div className="flex justify-center gap-4 mt-4">
                    <span className="text-xs text-gray-600">Built with React, Tailwind & Framer Motion</span>
                </div>
            </footer>
        );

        const App = () => {
            return (
                <div className="min-h-screen text-slate-200 selection:bg-purple-500/30">
                    <Navbar />
                    <Hero />
                    <About />
                    <Skills />
                    <Certifications />
                    <Projects />
                    <DesignWork />
                    <Timeline />
                    <Contact />
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
