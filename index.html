/* ============================== HELPERS ============================== */

function useIsTouch(){
  const [isTouch, setIsTouch] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia('(hover: none), (max-width: 860px)');
    const update = () => setIsTouch(mq.matches);
    update();
    mq.addEventListener ? mq.addEventListener('change', update) : mq.addListener(update);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', update) : mq.removeListener(update); };
  }, []);
  return isTouch;
}

function useActiveSection(ids){
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
    ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, [ids]);
  return active;
}

/* ============================== CUSTOM CURSOR ============================== */

function CustomCursor(){
  const isTouch = useIsTouch();
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  const labelRef = useRef(null);
  const pos = useRef({ x: 0, y: 0 });
  const ring = useRef({ x: 0, y: 0 });

  useEffect(() => {
    if (isTouch) return;
    let raf;
    const move = (e) => { pos.current = { x: e.clientX, y: e.clientY }; };
    window.addEventListener('mousemove', move);

    const tick = () => {
      ring.current.x += (pos.current.x - ring.current.x) * 0.2;
      ring.current.y += (pos.current.y - ring.current.y) * 0.2;
      if (dotRef.current) dotRef.current.style.transform = `translate(${pos.current.x}px, ${pos.current.y}px) translate(-50%,-50%)`;
      if (ringRef.current) ringRef.current.style.transform = `translate(${ring.current.x}px, ${ring.current.y}px) translate(-50%,-50%)`;
      if (labelRef.current) labelRef.current.style.transform = `translate(${ring.current.x}px, ${ring.current.y}px) translate(-50%,-50%)`;
      raf = requestAnimationFrame(tick);
    };
    tick();

    const over = (e) => {
      const el = e.target.closest('[data-cursor]');
      if (!el) {
        if (ringRef.current){ ringRef.current.style.width='34px'; ringRef.current.style.height='34px'; ringRef.current.style.background='transparent'; }
        if (labelRef.current) labelRef.current.style.opacity = '0';
        return;
      }
      const mode = el.getAttribute('data-cursor');
      if (mode === 'view' || mode === 'open') {
        if (ringRef.current){ ringRef.current.style.width='64px'; ringRef.current.style.height='64px'; ringRef.current.style.background='rgba(94,234,212,0.08)'; }
        if (labelRef.current){ labelRef.current.textContent = mode.toUpperCase(); labelRef.current.style.opacity='1'; }
      } else {
        if (ringRef.current){ ringRef.current.style.width='52px'; ringRef.current.style.height='52px'; ringRef.current.style.background='rgba(255,255,255,0.06)'; }
        if (labelRef.current) labelRef.current.style.opacity='0';
      }
    };
    window.addEventListener('mouseover', over);
    return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseover', over); cancelAnimationFrame(raf); };
  }, [isTouch]);

  if (isTouch) return null;
  return (
    <React.Fragment>
      <div id="cursor-ring" ref={ringRef}></div>
      <div id="cursor-dot" ref={dotRef}></div>
      <div id="cursor-label" ref={labelRef}></div>
    </React.Fragment>
  );
}

function Magnetic({ children, strength = 18, className, ...rest }){
  const ref = useRef(null);
  const [t, setT] = useState({ x: 0, y: 0 });
  const onMove = (e) => {
    const r = ref.current.getBoundingClientRect();
    const x = (e.clientX - r.left - r.width/2) / r.width;
    const y = (e.clientY - r.top - r.height/2) / r.height;
    setT({ x: x * strength, y: y * strength });
  };
  const onLeave = () => setT({ x: 0, y: 0 });
  return (
    <motion.div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave}
      animate={{ x: t.x, y: t.y }} transition={{ type: 'spring', stiffness: 150, damping: 12, mass: 0.2 }}
      className={className} {...rest}>
      {children}
    </motion.div>
  );
}

/* ============================== LOADER ============================== */

function Loader({ onDone }){
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { onDone(); return; }
    const start = performance.now();
    const dur = 1100;
    let raf;
    const step = (now) => {
      const p = Math.min(1, (now - start) / dur);
      setPct(Math.floor(p * 100));
      if (p < 1) raf = requestAnimationFrame(step);
      else setTimeout(onDone, 220);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, []);
  return (
    <motion.div exit={{ opacity: 0 }} transition={{ duration: 0.5 }}
      className="fixed inset-0 z-[999] bg-void flex flex-col items-center justify-center">
      <div className="font-display text-3xl tracking-tight mb-6">MPG</div>
      <div className="w-40 h-px bg-white/10 relative overflow-hidden">
        <div className="absolute inset-y-0 left-0 bg-cyan" style={{ width: `${pct}%` }}></div>
      </div>
      <div className="font-mono text-[11px] text-inkfaint mt-4 tracking-[0.2em] num-tag">{String(pct).padStart(3,'0')}%</div>
    </motion.div>
  );
}

/* ============================== HERO 3D ORB ============================== */

function HeroOrb(){
  const mountRef = useRef(null);
  const isTouch = useIsTouch();

  useEffect(() => {
    if (!mountRef.current || !window.THREE) return;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mount = mountRef.current;
    const width = mount.clientWidth, height = mount.clientHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 100);
    camera.position.z = 6.4;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.5 : 2));
    renderer.setSize(width, height);
    mount.appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    const geo = new THREE.IcosahedronGeometry(2.15, isTouch ? 1 : 2);
    const wire = new THREE.WireframeGeometry(geo);
    const mat = new THREE.LineBasicMaterial({ color: 0x5EEAD4, transparent: true, opacity: 0.55 });
    const lines = new THREE.LineSegments(wire, mat);
    group.add(lines);

    const innerGeo = new THREE.IcosahedronGeometry(1.55, 0);
    const innerWire = new THREE.WireframeGeometry(innerGeo);
    const innerMat = new THREE.LineBasicMaterial({ color: 0x6D5DFC, transparent: true, opacity: 0.35 });
    const innerLines = new THREE.LineSegments(innerWire, innerMat);
    group.add(innerLines);

    // point cloud shell
    const ptGeo = new THREE.BufferGeometry();
    const N = isTouch ? 140 : 320;
    const positions = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const r = 2.9 + Math.random() * 0.6;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i*3+2] = r * Math.cos(phi);
    }
    ptGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const ptMat = new THREE.PointsMaterial({ color: 0x9be8ff, size: 0.028, transparent: true, opacity: 0.7 });
    const points = new THREE.Points(ptGeo, ptMat);
    group.add(points);

    let mx = 0, my = 0, tx = 0, ty = 0;
    const onMove = (e) => {
      const r = mount.getBoundingClientRect();
      mx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      my = ((e.clientY - r.top) / r.height - 0.5) * 2;
    };
    const onTouch = (e) => {
      if (!e.touches || !e.touches[0]) return;
      const r = mount.getBoundingClientRect();
      const t = e.touches[0];
      mx = ((t.clientX - r.left) / r.width - 0.5) * 2;
      my = ((t.clientY - r.top) / r.height - 0.5) * 2;
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onTouch, { passive: true });
    window.addEventListener('touchstart', onTouch, { passive: true });

    let raf;
    const animate = () => {
      tx += (mx - tx) * 0.03; ty += (my - ty) * 0.03;
      group.rotation.y += reduce ? 0 : 0.0018;
      group.rotation.x = ty * 0.35;
      group.rotation.y += ty * 0.0001;
      group.rotation.z = tx * 0.08;
      points.rotation.y -= reduce ? 0 : 0.0009;
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };
    animate();

    const onResize = () => {
      const w = mount.clientWidth, h = mount.clientHeight;
      camera.aspect = w/h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', onResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onTouch);
      window.removeEventListener('touchstart', onTouch);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  }, [isTouch]);

  return <div ref={mountRef} className="w-full h-full"></div>;
}

function SkillOrbit(){
  const [hover, setHover] = useState(null);
  const isTouch = useIsTouch();
  const size = isTouch ? 340 : 620;
  const cx = size/2, cy = size/2;
  const ringR = size * 0.36;

  const nodes = useMemo(() => {
    const out = [];
    SKILL_GROUPS.forEach((g) => {
      const spread = 26;
      g.skills.forEach((s, i) => {
        const offset = (i - (g.skills.length-1)/2) * spread;
        const angle = (g.angle + offset) * Math.PI/180;
        out.push({
          ...s, group: g.group,
          x: cx + Math.cos(angle) * ringR,
          y: cy + Math.sin(angle) * ringR,
          angle: g.angle + offset,
        });
      });
    });
    return out;
  }, [size]);

  return (
    <div className="relative flex justify-center">
      <svg viewBox={`0 0 ${size} ${size}`} onClick={() => setHover(null)} className="w-full max-w-[620px] h-auto">
        <circle cx={cx} cy={cy} r={ringR} fill="none" stroke="rgba(255,255,255,0.08)" strokeDasharray="2 6" />
        <circle cx={cx} cy={cy} r={size*0.12} fill="rgba(94,234,212,0.05)" stroke="rgba(94,234,212,0.3)" />
        <text x={cx} y={cy-4} textAnchor="middle" className="font-mono" fontSize="11" fill="#5EEAD4" letterSpacing="2">TECH</text>
        <text x={cx} y={cy+12} textAnchor="middle" className="font-mono" fontSize="11" fill="#5EEAD4" letterSpacing="2">STACK</text>

        {nodes.map((n, i) => (
          <line key={'l'+i} x1={cx} y1={cy} x2={n.x} y2={n.y}
            stroke={hover === n.name ? '#5EEAD4' : 'rgba(255,255,255,0.08)'} strokeWidth={hover === n.name ? 1.4 : 1} />
        ))}

        {nodes.map((n, i) => (
          <g key={n.name} transform={`translate(${n.x},${n.y})`} data-cursor="link"
            onMouseEnter={isTouch ? undefined : () => setHover(n.name)}
            onMouseLeave={isTouch ? undefined : () => setHover(null)}
            onClick={(e) => { e.stopPropagation(); setHover(prev => prev === n.name ? null : n.name); }}
            style={{ cursor: 'pointer' }}>
            <circle r={hover === n.name ? 26 : (isTouch ? 23 : 20)} fill={hover === n.name ? 'rgba(94,234,212,0.14)' : 'rgba(255,255,255,0.04)'}
              stroke={hover === n.name ? '#5EEAD4' : 'rgba(255,255,255,0.15)'} style={{ transition: 'all .2s ease' }} />
            <text textAnchor="middle" dy="4" fontSize={isTouch ? 8.5 : 10} fill={hover === n.name ? '#5EEAD4' : '#eef1f6'} className="font-mono" style={{ pointerEvents: 'none' }}>
              {n.name.length > 10 && isTouch ? n.name.slice(0,8)+'…' : n.name}
            </text>
          </g>
        ))}
      </svg>

      <AnimatePresence>
        {hover && (
          <motion.div initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }}
            className="absolute bottom-0 left-1/2 -translate-x-1/2 md:left-auto md:right-0 md:translate-x-0 glass rounded-xl px-5 py-4 w-64 max-w-[82vw]">
            {(() => {
              const n = nodes.find(x => x.name === hover);
              return (
                <React.Fragment>
                  <div className="font-mono text-[10px] tracking-widest text-cyan uppercase mb-1">{n.group}</div>
                  <div className="font-display text-lg mb-2">{n.name}</div>
                  <div className="w-full h-1 bg-white/10 rounded-full overflow-hidden mb-1">
                    <div className="h-full bg-cyan rounded-full" style={{ width: `${n.level}%` }}></div>
                  </div>
                  <div className="font-mono text-[10px] text-inkdim num-tag">{n.level}% comfort</div>
                </React.Fragment>
              );
            })()}
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

/* ============================== DESIGN WORK ============================== */

function Reticle({ active }){
  const c = active ? 'border-cyan' : 'border-white/25';
  const base = `absolute w-4 h-4 md:w-5 md:h-5 border-white/25 transition-colors duration-300 ${active ? '!border-cyan' : ''}`;
  return (
    <React.Fragment>
      <span className={`${base} top-3 left-3 border-t border-l`}></span>
      <span className={`${base} top-3 right-3 border-t border-r`}></span>
      <span className={`${base} bottom-3 left-3 border-b border-l`}></span>
      <span className={`${base} bottom-3 right-3 border-b border-r`}></span>
    </React.Fragment>
  );
}

function DesignFrame({ item, index, onOpen }){
  const [errored, setErrored] = useState(false);
  const [hover, setHover] = useState(false);
  return (
    <motion.div
      initial={{ opacity: 0, y: 24 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: index * 0.08 }}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      onClick={() => onOpen(item)} data-cursor="view"
      className="relative shrink-0 w-[240px] md:w-[300px] aspect-[4/5] cursor-pointer group">

      {/* frame */}
      <div className="absolute inset-0 border border-white/10 rounded-sm overflow-hidden bg-panel">
        <div className="absolute inset-0 placeholder-media">
          {!errored && (
            <img src={item.img} alt={item.title} onError={() => setErrored(true)}
              className="absolute inset-0 w-full h-full object-cover grayscale-[35%] group-hover:grayscale-0 transition-all duration-500 group-hover:scale-[1.03]" />
          )}
          {errored && (
            <div className="absolute inset-0 flex items-center justify-center text-inkfaint font-mono text-[10px] uppercase tracking-widest">No Preview</div>
          )}
        </div>
        <div className="absolute inset-0 bg-gradient-to-t from-void/90 via-void/10 to-transparent"></div>

        {/* scan sweep on hover */}
        <motion.div aria-hidden="true"

          className="absolute left-0 right-0 h-10 pointer-events-none"
          style={{ background: 'linear-gradient(to bottom, transparent, rgba(94,234,212,0.16), transparent)' }}></motion.div>
      </div>

      <Reticle active={hover} />

      <div className="absolute top-5 left-5 font-mono text-[10px] text-inkfaint tracking-widest num-tag">
        SPEC {String(index + 1).padStart(2, '0')}
      </div>
      <div className={`absolute top-5 right-5 font-mono text-[10px] tracking-widest transition-colors duration-300 ${hover ? 'text-cyan' : 'text-inkfaint'}`}>
        {hover ? 'EXPAND ↗' : '1:1'}
      </div>

      <div className="absolute bottom-5 left-5 right-5">
        <span className="text-[10px] font-mono uppercase tracking-widest text-cyan">{item.tag}</span>
        <p className="font-display text-base md:text-lg mt-1 text-ink leading-snug">{item.title}</p>
      </div>
    </motion.div>
  );
}

function Lightbox({ item, onClose }){

      <motion.div initial={{ scale: 0.94, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} onClick={(e) => e.stopPropagation()} className="max-w-md w-full relative">
        <div className="relative rounded-sm overflow-hidden border border-white/10 placeholder-media aspect-square">
          {!errored && <img src={item.img} alt={item.title} onError={() => setErrored(true)} className="w-full h-full object-cover" />}
          <Reticle active={true} />

        <div className="flex items-center justify-between mt-5 font-mono text-[10px] text-inkfaint tracking-widest uppercase">
          <span>SPEC {String(idx + 1).padStart(2, '0')} / {String(DESIGN_WORK.length).padStart(2, '0')}</span>

          <span className="text-[10px] font-mono uppercase tracking-widest text-cyan">{item.tag}</span>
          <p className="font-display text-2xl mt-1">{item.title}</p>
        </div>
      </motion.div>
    </motion.div>
  );
}

/* ============================== TERMINAL ============================== */

function Terminal(){
  const [lines, setLines] = useState([]);
  const ref = useRef(null);
  const inView = useRef(false);

  useEffect(() => {
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !inView.current) {
        inView.current = true;
        const sequence = ["manuga@portfolio:~$ whoami", "→ Frontend Developer", "→ Python Learner", "→ Data Analytics Enthusiast", "→ Digital Creator", "manuga@portfolio:~$ ▌"];
        sequence.forEach((l, i) => setTimeout(() => setLines(prev => [...prev, l]), i * 420));
      }
    }, { threshold: 0.4 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);

  return (
    <section ref={ref} className="py-20 md:py-40 container mx-auto px-6">
      <Eyebrow index="06">Terminal</Eyebrow>
      <div className="max-w-2xl mx-auto">
        <div className="panel rounded-2xl overflow-hidden">
          <div className="flex items-center gap-2 px-5 py-3 border-b border-white/8">
            <span className="w-2.5 h-2.5 rounded-full bg-[#ff5f56]"></span>
            <span className="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]"></span>
            <span className="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></span>
            <span className="font-mono text-[11px] text-inkfaint ml-3">zsh — portfolio</span>
          </div>
          <div className="p-6 font-mono text-sm space-y-2 min-h-[220px]">
            {lines.map((l, i) => (
              <div key={i} className={l.startsWith('→') ? 'text-cyan pl-2' : 'text-ink/90'}>{l}</div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}
